<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kvíz</title><link rel="stylesheet" href="/style.css"></head>
<body><main id="app"></main>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=id=>document.getElementById(id), L='ABCD';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const s=io();
let me=JSON.parse(localStorage.kviz||'null')||{token:(crypto.randomUUID?crypto.randomUUID():String(Math.random())),name:''};
let joined=false,st=null,off=0;
function join(n){me.name=n;localStorage.kviz=JSON.stringify(me);s.emit('join',{token:me.token,name:n});}
s.on('connect',()=>{if(joined)join(me.name);});
s.on('joined',()=>{joined=true;});
s.on('err',m=>{joined=false;if($('err'))$('err').textContent=m;});
s.on('state',v=>{st=v;off=v.now-Date.now();if(v.role==='guest')joined=false;draw();});
function form(){
  $('app').innerHTML=`<h1>Kvíz: Jak dobrý jsi řešitel?</h1><div class="panel">
  <label for="nm">Tvoje jméno</label><input id="nm" type="text" maxlength="20" autocomplete="nickname" value="${esc(me.name)}">
  <p class="err" id="err"></p><button id="go">Připojit se</button></div>`;
  const go=()=>join($('nm').value.trim()); $('go').onclick=go;
  $('nm').onkeydown=e=>{if(e.key==='Enter')go();};
}
function draw(){
  const v=st,a=$('app');
  if(v.role==='guest'){
    if(!$('nm'))form();
    if(v.phase==='none'&&$('err')&&!$('err').textContent)$('err').textContent='Učitel zatím nezačal hru. Zůstaň na stránce a zkus to za chvíli.';
    return;
  }
  const m=v.me;
  const head=`<div class="mute">${esc(m.name)} · ${m.score} b.</div>`;
  if(v.phase==='lobby'){a.innerHTML=`${head}<h1>Jsi ve hře</h1><p>Počkej, až učitel spustí první otázku.</p>`;return;}
  if(v.phase==='question'){
    const done=m.idx!==null;
    a.innerHTML=`${head}<div class="timer" id="tm"></div><div class="bar"><i id="br"></i></div>
    <div class="mute" style="margin-top:10px">Otázka ${v.round} z ${v.rounds}</div>
    <div class="q">${esc(v.q.text)}</div>
    <div class="answers">${v.q.answers.map((t,i)=>`<button class="ans a${i}${done&&m.idx===i?' mine':''}${done&&m.idx!==i?' dim':''}" data-i="${i}" ${done?'disabled':''}><b>${L[i]}</b><span>${esc(t)}</span></button>`).join('')}</div>
    ${done?'<p class="mute">Odpověď odeslána. Čekej na ostatní.</p>':''}`;
    a.querySelectorAll('.ans').forEach(b=>b.onclick=()=>s.emit('answer',+b.dataset.i));
    tick();return;
  }
  if(v.phase==='reveal'){
    const r=m.last;
    a.innerHTML=`${head}<div class="mute">Otázka ${v.round} z ${v.rounds}</div><div class="q">${esc(v.q.text)}</div>
    <div class="answers">${v.q.answers.map((t,i)=>`<div class="ans a${i}${i===v.correct?' right':' dim'}${m.idx===i?' mine':''}"><b>${L[i]}</b><span>${esc(t)}</span></div>`).join('')}</div>
    <div class="panel">${m.idx===null?'<div class="big bad">Neodpověděl/a jsi</div>':r&&r.correct?`<div class="big ok">Správně! +${r.pts} b.</div>`:'<div class="big bad">Špatně, 0 b.</div>'}
    <div>Celkem ${m.score} b. · zatím ${m.rank}. místo</div></div><p class="mute">Čekej na pořadí.</p>`;
    return;
  }
  if(v.phase==='board'){
    a.innerHTML=`${head}<h1>${v.final?'Konečné pořadí':`Pořadí po ${v.round}. kole`}</h1>
    <div class="panel"><table><tr><th>#</th><th>Jméno</th><th class="n">+</th><th class="n">Body</th></tr>
    ${v.board.map(p=>`<tr class="${p.name===m.name?'me':''}"><td>${p.rank}</td><td>${esc(p.name)}</td><td class="n mute">${p.delta?'+'+p.delta:''}</td><td class="n">${p.score}</td></tr>`).join('')}</table></div>
    ${v.final?'':'<p class="mute">Čekej na další otázku.</p>'}`;
  }
}
function tick(){
  if(!st||st.phase!=='question'||!$('tm'))return;
  const rem=Math.max(0,(st.endsAt-(Date.now()+off))/1000);
  $('tm').textContent=Math.ceil(rem);$('br').style.width=(100*rem/st.time)+'%';
}
setInterval(tick,100);
</script></body></html>
